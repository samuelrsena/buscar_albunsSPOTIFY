<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador de Álbuns</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Busque seu Álbum</h1>

    <button id="login-btn" hidden>Entrar com Spotify</button>

    <form id="search-form" hidden>
      <input id="artist-input" placeholder="Nome do artista..." required>
      <button type="submit">Buscar</button>
    </form>

    <p id="status"></p>

    <section id="artists" class="grid"></section>

    <h2 id="albums-title" hidden></h2>

    <div id="filters" class="filters" hidden>
      <label>
        Tipo
        <select id="filter-type">
          <option value="all">Todos</option>
          <option value="album">Álbuns</option>
          <option value="single">Singles</option>
        </select>
      </label>

      <label>
        Ordenar por
        <select id="filter-sort">
          <option value="year-desc">Ano: mais recente</option>
          <option value="year-asc">Ano: mais antigo</option>
          <option value="name-asc">Nome: A–Z</option>
          <option value="name-desc">Nome: Z–A</option>
        </select>
      </label>
    </div>

    <section id="albums" class="grid"></section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
